<section class="zone" id="activity-zone">
  <div class="zone-header">
    <div style="display:flex;align-items:center;gap:var(--space-3)">
      <span class="zone-title">Activity Feed</span>
      <span id="activity-count" class="font-mono" style="font-size:0.625rem;color:var(--text-muted);background:var(--bg-base);padding:2px 8px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)">0 events</span>
    </div>
    <div style="display:flex;align-items:center;gap:var(--space-2)">
      <div style="display:flex;background:var(--bg-base);border-radius:var(--radius-sm);padding:2px">
        <button class="log-filter btn" data-filter="all" style="font-size:0.6875rem;padding:var(--space-1) var(--space-3)">All</button>
        <button class="log-filter btn" data-filter="general" style="font-size:0.6875rem;padding:var(--space-1) var(--space-3)">General</button>
        <button class="log-filter btn" data-filter="recycling" style="font-size:0.6875rem;padding:var(--space-1) var(--space-3)">Recycling</button>
        <button class="log-filter btn" data-filter="compost" style="font-size:0.6875rem;padding:var(--space-1) var(--space-3)">Compost</button>
      </div>
      <button class="btn btn-icon" id="btn-clear-log" title="Clear" style="width:28px;height:28px">🗑</button>
    </div>
  </div>

  <div class="zone-body" style="padding:0">
    <div class="activity-feed" id="activity-feed">
      <div class="activity-empty">No activity yet</div>
    </div>
  </div>
</section>
