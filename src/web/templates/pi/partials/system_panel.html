<section class="zone" id="system-zone">
  <div class="zone-header">
    <span class="zone-title">System Status</span>
    <button class="btn btn-icon" id="btn-refresh-health" title="Refresh">↻</button>
  </div>

  <div class="zone-body" style="display:flex;flex-direction:column;gap:var(--space-5)">
    <!-- CPU Temperature -->
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-2)">
        <span style="font-size:0.8125rem;color:var(--text-secondary)">CPU Temperature</span>
        <span id="health-temp" class="font-mono" style="font-size:1rem;font-weight:600">--°C</span>
      </div>
      <div class="gauge-bar">
        <div class="gauge-bar-fill" id="temp-bar" style="width:0%"></div>
      </div>
    </div>

    <!-- Uptime -->
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:0.8125rem;color:var(--text-secondary)">Uptime</span>
      <span id="health-uptime" class="font-mono" style="font-size:0.9375rem;font-weight:500">--</span>
    </div>

    <!-- Subsystem grid -->
    <div class="stat-grid">
      <div class="stat-item">
        <span class="label">Camera</span>
        <span class="value" id="health-camera" style="color:var(--text-muted)">--</span>
      </div>
      <div class="stat-item">
        <span class="label">Servos</span>
        <span class="value" id="health-servos" style="color:var(--text-muted)">--</span>
      </div>
      <div class="stat-item">
        <span class="label">Wi-Fi</span>
        <span class="value" id="health-wifi" style="color:var(--text-muted)">--</span>
      </div>
      <div class="stat-item">
        <span class="label">Inference</span>
        <span class="value" id="health-inference" style="color:var(--text-muted)">--</span>
      </div>
    </div>

    <!-- Classification Mode -->
    <div>
      <div class="zone-title" style="margin-bottom:var(--space-3);padding:0;border:none">Classification Mode</div>
      <div class="mode-switch">
        <button class="mode-option" id="mode-llm" data-mode="llm">🧠 LLM</button>
        <button class="mode-option" id="mode-yolo" data-mode="yolo">👁️ YOLO</button>
      </div>
    </div>

    <!-- Quick stats -->
    <div class="stat-grid">
      <div class="stat-item">
        <span class="label">Sorted</span>
        <span class="value" id="stat-total">0</span>
      </div>
      <div class="stat-item">
        <span class="label">General</span>
        <span class="value" id="stat-general" style="color:var(--cat-general)">0</span>
      </div>
      <div class="stat-item">
        <span class="label">Recycling</span>
        <span class="value" id="stat-recycling" style="color:var(--cat-recycling)">0</span>
      </div>
      <div class="stat-item">
        <span class="label">Compost</span>
        <span class="value" id="stat-compost" style="color:var(--cat-compost)">0</span>
      </div>
    </div>
  </div>
</section>
