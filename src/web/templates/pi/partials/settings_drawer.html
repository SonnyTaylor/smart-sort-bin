<!-- Drawer overlay -->
<div class="drawer-overlay" id="drawer-overlay"></div>

<!-- Settings drawer -->
<aside class="drawer" id="settings-drawer">
  <div class="drawer-header">
    <span class="drawer-title">Settings</span>
    <button class="btn btn-icon" id="btn-close-settings" style="width:32px;height:32px">✕</button>
  </div>

  <div class="drawer-body">
    <!-- Provider Settings -->
    <div class="drawer-section">
      <div class="drawer-section-title">LLM Providers</div>
      <div id="provider-list">
        <div style="font-size:0.875rem;color:var(--text-muted)">Loading providers…</div>
      </div>
    </div>

    <!-- Debug -->
    <div class="drawer-section">
      <div class="drawer-section-title">Debug</div>
      <div style="display:flex;gap:var(--space-2);margin-bottom:var(--space-3)">
        <select id="debug-endpoint" style="flex:1">
          <option value="/api/health">GET /api/health</option>
          <option value="/api/stats">GET /api/stats</option>
          <option value="/api/providers">GET /api/providers</option>
          <option value="/api/camera">GET /api/camera</option>
        </select>
        <button class="btn" id="btn-debug-run">Run</button>
      </div>
      <pre class="debug-output" id="debug-output">Select an endpoint and click Run…</pre>

      <div style="margin-top:var(--space-5)">
        <div class="drawer-section-title" style="margin-bottom:var(--space-2)">SSE Events</div>
        <div class="debug-output" id="sse-log" style="max-height:160px">Waiting for events…</div>
      </div>
    </div>
  </div>
</aside>
