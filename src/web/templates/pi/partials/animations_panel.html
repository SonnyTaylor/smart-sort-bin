<div class="stack-4">
  <section class="panel">
    <div class="panel-header">
      <span class="panel-title">
        Animations
        <span class="badge info" id="anim-playing-badge" style="display:none">Playing</span>
      </span>
      <button class="btn btn-sm btn-danger" id="btn-anim-stop" style="display:none">
        <svg class="icon"><use href="#i-stop"/></svg>
        Stop
      </button>
    </div>
    <div class="panel-body stack-4">
      <div class="anim-grid" id="anim-grid">
        <div class="feed-empty">Loading animations…</div>
      </div>

      <div id="saved-sequences-wrap" style="display:none">
        <div class="section-label">Saved Sequences</div>
        <div id="saved-sequences"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <span class="panel-title">Sequence Editor</span>
      <div class="panel-actions">
        <input type="text" id="seq-name" placeholder="Sequence name" style="width:170px">
        <label class="check"><input type="checkbox" id="seq-loop"> Loop</label>
      </div>
    </div>
    <div class="panel-body stack-3">
      <div style="overflow-x:auto">
        <table class="seq-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Pan</th>
              <th>Tilt</th>
              <th>Duration (ms)</th>
              <th>Easing</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="seq-rows"></tbody>
        </table>
      </div>

      <div class="row" style="flex-wrap:wrap">
        <button class="btn btn-sm" id="btn-seq-add">
          <svg class="icon"><use href="#i-plus"/></svg>
          Add keyframe
        </button>
        <button class="btn btn-sm" id="btn-seq-capture" title="Add a keyframe at the current servo position">
          <svg class="icon"><use href="#i-crosshair"/></svg>
          Capture position
        </button>
        <span class="grow"></span>
        <button class="btn btn-sm" id="btn-seq-preview">
          <svg class="icon"><use href="#i-play"/></svg>
          Preview
        </button>
        <button class="btn btn-sm btn-primary" id="btn-seq-save">
          <svg class="icon"><use href="#i-save"/></svg>
          Save
        </button>
      </div>
      <div class="small muted">
        Each keyframe moves the head to a position over its duration. Easing "hold" jumps instantly then pauses — use it for beats and freezes.
      </div>
    </div>
  </section>
</div>
