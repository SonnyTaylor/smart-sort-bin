<header class="dashboard-header">
  <div class="brand">
    <div class="brand-icon">🗑️</div>
    <div>
      <div class="brand-title">Smart Bin</div>
      <div class="brand-subtitle">Control Surface · Pi 3B</div>
    </div>
  </div>

  <div class="header-status">
    <div class="status-pill">
      <span id="sse-indicator" class="indicator indicator-pulse" style="color:var(--status-error);background:var(--status-error)"></span>
      <span id="sse-label">Offline</span>
    </div>
    <div class="status-pill">
      <span>CPU</span>
      <span id="header-cpu" class="value">--°C</span>
    </div>
    <div class="status-pill">
      <span>Up</span>
      <span id="header-uptime" class="value">--</span>
    </div>
    <button class="btn btn-icon" id="btn-settings" title="Settings">⚙️</button>
  </div>
</header>
