<header class="topbar">
  <div class="brand">
    <div class="brand-mark"><svg class="icon"><use href="#i-bin"/></svg></div>
    <div>
      <div class="brand-name">Smart Bin</div>
      <div class="brand-sub">Pi 3B · Control</div>
    </div>
  </div>

  <div class="topbar-status">
    <span class="pill">
      <span id="sse-indicator" class="dot pulse"></span>
      <span id="sse-label">Offline</span>
    </span>
    <span class="pill">CPU <span id="header-cpu" class="value">--</span></span>
    <span class="pill">Up <span id="header-uptime" class="value">--</span></span>
    <button class="btn btn-icon" id="btn-settings" title="Settings" aria-label="Settings">
      <svg class="icon"><use href="#i-settings"/></svg>
    </button>
  </div>
</header>
