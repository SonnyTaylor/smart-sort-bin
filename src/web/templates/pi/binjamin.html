<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binjamin — Your Smart Bin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🗑️%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/pi-dashboard.css">
  <style>
    .binjamin-page {
      display: grid;
      grid-template-columns: 1fr 420px;
      grid-template-rows: auto 1fr;
      height: 100vh;
      gap: 0;
      overflow: hidden;
    }

    .binjamin-header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-5);
      border-bottom: 1px solid var(--border-default);
      background: var(--bg-surface);
    }

    .binjamin-header .brand {
      gap: var(--space-2);
    }

    .binjamin-header .brand-icon {
      width: 32px;
      height: 32px;
      font-size: 1.1rem;
    }

    .binjamin-header .brand-title {
      font-size: 1.1rem;
    }

    .binjamin-header .brand-subtitle {
      font-size: 0.5625rem;
    }

    .header-links {
      display: flex;
      gap: var(--space-2);
    }

    .header-links a {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: var(--space-1) var(--space-3);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
    }

    .header-links a:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* Camera column */
    .binjamin-camera {
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .binjamin-camera .camera-zone {
      flex: 1;
      aspect-ratio: unset;
      border-radius: 0;
    }

    .binjamin-camera .camera-zone img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cam-controls {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: var(--bg-surface);
      border-top: 1px solid var(--border-default);
    }

    .cam-controls .status-pill {
      font-size: 0.625rem;
      padding: var(--space-1) var(--space-2);
    }

    /* Chat column */
    .binjamin-chat {
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border-left: 1px solid var(--border-default);
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-subtle);
    }

    .chat-header-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-8);
    }

    .chat-thinking {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: var(--space-3) var(--space-4);
      align-self: flex-start;
    }

    .thinking-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: thinkPulse 1.2s ease-in-out infinite;
    }
    .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes thinkPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }

    .chat-msg {
      max-width: 88%;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      line-height: 1.55;
      animation: msgSlide 0.25s ease forwards;
    }

    .chat-msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: var(--bg-base);
      border-bottom-right-radius: var(--radius-sm);
    }

    .chat-msg.binjamin {
      align-self: flex-start;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-default);
      border-bottom-left-radius: var(--radius-sm);
    }

    .chat-msg-text { word-break: break-word; }

    .chat-msg-time {
      font-family: var(--font-mono);
      font-size: 0.5625rem;
      color: var(--text-disabled);
      margin-top: var(--space-1);
      text-align: right;
    }

    .chat-msg.user .chat-msg-time { color: rgba(12,12,12,0.4); }

    .chat-emote {
      color: var(--accent-dim);
      font-style: italic;
      font-size: 0.8125rem;
    }
    .chat-msg.user .chat-emote { color: rgba(12,12,12,0.55); }

    .chat-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: var(--space-2);
    }

    .chat-tool-tag {
      font-family: var(--font-mono);
      font-size: 0.5625rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 1px 6px;
      background: rgba(201,169,110,0.12);
      color: var(--accent);
      border: 1px solid rgba(201,169,110,0.2);
      border-radius: var(--radius-sm);
    }

    @keyframes msgSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Input area */
    .chat-input-area {
      padding: var(--space-3) var(--space-4);
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-surface);
    }

    .chat-options {
      display: flex;
      gap: var(--space-3);
      margin-bottom: var(--space-2);
    }

    .chat-option {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      font-size: 0.6875rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .chat-input-row {
      display: flex;
      gap: var(--space-2);
      align-items: center;
    }

    .chat-text-input {
      flex: 1;
      min-width: 0;
    }

    .chat-mic-btn {
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .chat-mic-btn.listening {
      border-color: var(--status-error) !important;
      color: var(--status-error) !important;
      animation: micPulse 1.2s ease-in-out infinite;
    }

    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
    }

    .mic-label {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      color: var(--status-error);
      min-height: 1em;
      margin-top: var(--space-1);
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .binjamin-page {
        grid-template-columns: 1fr;
        grid-template-rows: auto 40vh 1fr;
      }
      .binjamin-chat {
        border-left: none;
        border-top: 1px solid var(--border-default);
      }
    }
  </style>
</head>
<body>
  <div class="binjamin-page">
    <!-- Header -->
    <header class="binjamin-header">
      <div class="brand">
        <div class="brand-icon">🗑️</div>
        <div>
          <div class="brand-title">Binjamin</div>
          <div class="brand-subtitle">Your friendly smart bin</div>
        </div>
      </div>
      <div class="header-links">
        <a href="/pi/v2">Dashboard</a>
        <span class="status-pill" style="font-size:0.625rem">
          <span id="sse-indicator" class="indicator indicator-pulse" style="background:var(--status-error);color:var(--status-error)"></span>
          <span id="sse-label">Offline</span>
        </span>
      </div>
    </header>

    <!-- Camera -->
    <div class="binjamin-camera">
      <div class="camera-zone">
        <img id="cam-stream" src="/api/camera/stream" alt="Camera"
             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 640 480%22%3E%3Crect fill=%22%230a0a0a%22 width=%22640%22 height=%22480%22/%3E%3Ctext x=%22320%22 y=%22240%22 text-anchor=%22middle%22 fill=%22%23333%22 font-family=%22monospace%22 font-size=%2214%22%3ENO SIGNAL%3C/text%3E%3C/svg%3E'">
        <div class="viewfinder-overlay">
          <div class="corner-bracket cb-tl"></div>
          <div class="corner-bracket cb-tr"></div>
          <div class="corner-bracket cb-bl"></div>
          <div class="corner-bracket cb-br"></div>
        </div>
        <div class="live-badge" id="cam-live-badge">
          <span class="indicator indicator-pulse" style="background:var(--status-error);color:var(--status-error)"></span>
          <span>Live</span>
        </div>
      </div>
      <div class="cam-controls">
        <span class="status-pill">CPU <span id="header-cpu" class="value">--</span></span>
        <span class="status-pill">Up <span id="header-uptime" class="value">--</span></span>
        <div style="flex:1"></div>
        <label class="chat-option">
          <input type="checkbox" id="chat-camera-toggle" checked style="accent-color:var(--accent)">
          <span>Send camera to Binjamin</span>
        </label>
      </div>
    </div>

    <!-- Chat -->
    <div class="binjamin-chat">
      <div class="chat-header">
        <span class="chat-header-title">💬 Chat</span>
        <div style="display:flex;gap:var(--space-2);align-items:center">
          <button class="btn" style="font-size:0.6875rem;padding:var(--space-1) var(--space-3)" onclick="if(SB.binjamin) SB.binjamin.clearChat()">Clear</button>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="chat-empty">
          <div style="font-size:2.5rem;margin-bottom:var(--space-3)">🗑️</div>
          <div style="color:var(--text-secondary);font-weight:600;font-size:1.1rem;margin-bottom:var(--space-2)">G'day! I'm Binjamin.</div>
          <div style="color:var(--text-muted);font-size:0.8125rem;line-height:1.6;max-width:280px">
            Your friendly smart bin. Talk to me about rubbish, ask me to look around, or just have a chat!
          </div>
          <div style="margin-top:var(--space-4);display:flex;flex-wrap:wrap;gap:var(--space-2);justify-content:center">
            <button class="btn" style="font-size:0.75rem;padding:var(--space-2) var(--space-3)" onclick="SB.binjamin.send('Hello Binjamin!')">👋 Say hello</button>
            <button class="btn" style="font-size:0.75rem;padding:var(--space-2) var(--space-3)" onclick="SB.binjamin.send('What can you see right now?')">👁️ Look around</button>
            <button class="btn" style="font-size:0.75rem;padding:var(--space-2) var(--space-3)" onclick="SB.binjamin.send('Tell me a joke')">😄 Tell a joke</button>
          </div>
        </div>
        <div class="chat-thinking" id="chat-thinking" style="display:none">
          <span class="thinking-dot"></span>
          <span class="thinking-dot"></span>
          <span class="thinking-dot"></span>
        </div>
      </div>

      <div class="chat-input-area">
        <form class="chat-input-row" id="chat-form">
          <button type="button" class="btn btn-icon chat-mic-btn" id="chat-mic" title="Talk to Binjamin">🎙️</button>
          <input type="text" class="chat-text-input" id="chat-input"
                 placeholder="Say something to Binjamin…" autocomplete="off">
          <button type="submit" class="btn btn-primary btn-icon" id="chat-send" title="Send">➤</button>
        </form>
        <div id="mic-label" class="mic-label"></div>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/static/js/pi/api.js"></script>
  <script src="/static/js/pi/state.js"></script>
  <script src="/static/js/pi/ui.js"></script>
  <script src="/static/js/pi/sse.js"></script>
  <script src="/static/js/pi/fun-controls.js"></script>
  <script src="/static/js/pi/binjamin.js"></script>
  <script>
    // Binjamin page initialization
    document.addEventListener('DOMContentLoaded', function () {
      SB.binjamin.init();

      // Connect SSE for live indicator
      if (SB.sse && SB.sse.connect) SB.sse.connect();

      // Health polling
      async function loadHealth() {
        try {
          var h = await SB.api.health();
          var cpu = document.getElementById('header-cpu');
          var up = document.getElementById('header-uptime');
          if (cpu) cpu.textContent = (h.cpu_temp_c || 0) + 'C';
          if (up) up.textContent = SB.ui.formatUptime(h.uptime_seconds || 0);
        } catch (e) {}
      }
      loadHealth();
      setInterval(loadHealth, 5000);
    });
  </script>
</body>
</html>
